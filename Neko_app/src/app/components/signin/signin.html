<div class="signin-container">
  <h2>Sign In</h2>

  <form [formGroup]="signinForm" (ngSubmit)="onSubmit()">

    <!-- Email or Mobile -->
    <div class="form-group">
      <input type="text"
             formControlName="emailOrMobile"
             placeholder="Enter your email or mobile"
             [class.invalid]="f['emailOrMobile'].invalid && f['emailOrMobile'].touched" />
      <div class="error" *ngIf="f['emailOrMobile'].touched && f['emailOrMobile'].errors">
        <small *ngIf="f['emailOrMobile'].errors['required']">Email or mobile is required</small>
        <small *ngIf="f['emailOrMobile'].errors['pattern']">Enter a valid email or 10-digit mobile</small>
      </div>
    </div>

    <!-- Password -->
    <div class="form-group">
      <input type="password"
             formControlName="password"
             placeholder="Enter your password"
             [class.invalid]="f['password'].invalid && f['password'].touched" />
      <div class="error" *ngIf="f['password'].touched && f['password'].errors">
        <small *ngIf="f['password'].errors['required']">Password is required</small>
        <small *ngIf="f['password'].errors['minlength']">Minimum 8 characters</small>
      </div>
    </div>

    <div class="form-options">
      <a (click)="forgotPassword()">Forgot Password?</a>
    </div>

    <button type="submit" class="btn btn-primary">Sign In</button>

    <p class="signup-link">
      Don’t have an account?
      <a (click)="goToSignup()">Sign Up</a>
    </p>

    <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
  </form>
</div>
