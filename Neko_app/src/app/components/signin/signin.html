<div class="login-container">
  <h2>Sign In</h2>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <input type="text" formControlName="emailOrMobile" placeholder="Email or Mobile" />
      <div class="error" *ngIf="submitted && f['emailOrMobile'].errors">
        <small *ngIf="f['emailOrMobile'].errors['required']">This field is required</small>
      </div>
    </div>

    <div class="form-group">
      <input type="password" formControlName="password" placeholder="Password" />
      <div class="error" *ngIf="submitted && f['password'].errors">
        <small *ngIf="f['password'].errors['required']">Password is required</small>
        <small *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</small>
      </div>
    </div>

    <button type="submit">Sign In</button>

    <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
  </form>

  <div class="links">
    <a (click)="onForgotPassword()">Forgot Password?</a>
    <p>Don't have an account? <a (click)="onSignup()">Sign Up</a></p>
  </div>
</div>
