<h2>Users</h2>
<ul>
  <li *ngFor="let user of users">
    {{user.id}} - {{user.name}} - {{user.email}} - {{user.mobile}}
  </li>
</ul>

<h3>Add New User</h3>
<div>
  <input placeholder="Name" [(ngModel)]="newUser.name" />
  <input placeholder="Email" [(ngModel)]="newUser.email" />
  <input placeholder="Password" [(ngModel)]="newUser.password" />
  <input placeholder="Mobile" [(ngModel)]="newUser.mobile" />
  <button (click)="addUser()">Add User</button>
</div>

<p>{{message}}</p>
